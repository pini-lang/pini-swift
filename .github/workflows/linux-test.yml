name: Linux Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 同一分支的新推送取消旧运行：判的是最新提交，排队的旧运行只会占机器。
concurrency:
  group: linux-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-test:
    name: Linux · Docker · Swift 6.4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # buildx 只为 gha 层缓存：镜像构建与容器启动都在 ci/run.sh 里，本地跑同一份。
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run pipeline
        run: bash ci/run.sh
