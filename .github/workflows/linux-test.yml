name: Linux Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  linux-test:
    name: Swift Test (Ubuntu)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        swift: ["5.9", "6.0"]
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comment Style Lint
        run: bash hooks/comment-lint.sh

      - name: Build
        run: swift build --disable-sandbox

      - name: Test
        run: swift test --disable-sandbox
