name: Linux Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linux-test:
    name: Swift Test (Ubuntu)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        swift: ["6.2-noble", "6.3-noble"]
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comment Style Lint
        run: bash hooks/comment-lint.sh

      - name: Doc Link Check
        run: bash tools/check-doc-links.sh

      - name: Build
        run: swift build --disable-sandbox

      - name: Test
        run: swift test --disable-sandbox
