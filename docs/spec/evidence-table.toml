e-hir-stringsplit-delimiter-semantics-2026-09-15.md`（**登记不修**，待 spec §1.3 裁「分隔符 = 子串还是字符集」）；**不违反 §10.4**（那条禁止的是给 `stringSplit` **格本身**造第二个状态源，本单的对象是另一件事）；B 组工单**明文排除 `split`** ⇒ 也不是它的载体。②③ = 上列两条判据器械收获。**范围声明（写成范围、不写成遗漏）**：只做契约**已裁的那一项**；**未改分隔符语义 · 未改 LLVM 侧 · 未改 HIR 侧 · 未改契约的语义**（只更新条目 39 与 §6 的状态表述）；**未新增差分夹具文件**。**未做**：未收窄探针的阻塞与缺口计数器判据（收窄时机仍为上交给决策点）· 未做字符串字节语义格 / 取址格 · 未 push。**替此前三格补账一处**：P2 细目件的**顶部状态行滞后三格**（仍停在「下一步 = P2b」），由本格一并订正，并已注明是代 G7 / G8 / G9 补的。**四张前置格进度**：IO 语义格 ✅（2026-09-14）· **`stringSplit` 格 ✅（本格）** · 字符串字节语义格 ⏳ · 取址格 ⏳。"

