note = "格属性：**P3 第二格 G2（判据缺口台账落件）**。**用户三项裁定**：① 载体 = **新建独立台账件**（`docs/hir-criteria-gap-ledger.md`，与 `llvm-capability-matrix.md` 同族的清单件：**不带 `issue-` 前缀、不带日期** —— 它不是工单）· ② 口径 = **全列 13 条**（**不合并**回此前临时收敛的「9 条」）· ③ 逐条**评估工作量与阻塞，工作量小的直接做**。**交付**：`CG-01`–`CG-13` 收敛成一张表并各自标注状态 —— **已处置 6**（`CG-01`/`02`/`05`/`06` 由 G1；`CG-04`/`07` 由本格）· **待处置 5**（`CG-03`/`09`/`10`/`11`/`12`）· **登记不修 1**（`CG-08`）· **需裁决 1**（`CG-13`）；分四族（探针判据 / 单测 parity 结构性失明 / 单源门控的账写窄 / 规范一致性），**性质不同、不可混着数**。两处悬空指针 **`并入 P3 判据缺口清单`**（主计划 §13 的 G6 条目末 · P2 细目 §8.4 末）**已改指本件** —— 本件首次给出「判据缺口在册」这一问句的**单一答案**（此前条目散在 5 处：主计划 §13 / 细目 §8.4 + §10.3 / parity 工单 / P1-4 遗留②③④）。**与工单的分工**：台账 §7 明写 `run-llvm` 静默属**产品缺陷**、归 parity 工单（保持 Open），本表只收它派生的**判据**后果（`CG-01`/`02`/`05`/`06`）⇒ 不重复登记。**本格唯一的代码改动 = `CG-07`**：探针加 `--out`（默认值不变），动机是 G1 实测的器械翻车（输出路径写死 ⇒ 变异反证与基线 sweep 共用路径、冻结件被变异件残留污染）；**行为中性已证**（TSV 37550 字节、md5 `053637aa988b2482c3d299a42d2859e7`、与 G1 冻结件 `cmp` 逐字节相同、读数零位移）⇒ 探针 md5 `c2f0cb1a4759509fa19fa3e6d7214707` → **`5446405c05766a34a9c93bc1eca2bd96`** 而判定不动。⭐ **`CG-10` 实测订正**：各处写的「异类型字面量臂恒真**结构性不可观测**」不准确 —— 本格构造反例三通道现跑（scrutinee `String` + 臂字面量 `int`：`pini check` **rc=0**、`interp-ast` 与 `interp-hir` **均输出 `wild`**）⇒ 该形态**合法且可达**，M1 无靶点是**语料未覆盖**；且**补语料本身不充分**（`matchArmMatches` 是两解释器臂**共用**谓词 ⇒ 单测 parity 仍失明），**能见证它的是探针**（含 LLVM 臂这一对）⇒ `CG-10` 与 `CG-09` 是**同一件事的两面**，须并在 G3 处置。**`CG-08` 补实测理由**：残差规则不可行使的根因由「零语料」升级为**架构层不可构造**（`HIRExecutor` 无非致命告警通道 —— 诊断仅 `noLocation` 占位与 `RuntimeError`，后者要求 `rc != 0`；而两解释器臂共用前端 ⇒ 前端警告必然两边都有）⇒ 规则**保留**（G1 已裁）并继续标注 `UNEXERCISED`、**不宣称有判别力**。**评估表结论（用户第 ③ 项）**：`CG-08` 零工作量**已结项** · **`CG-13` 有阻塞**（B 组 6 项名单三方错位 —— 契约 §6 汇总行含 §2.**40**、而 §2.40 行自陈「测量未予支持、待裁」、字符串工单自述范围含 §2.**39** ⇒ 属**规范内容变更，须走 spec §1.3 + 用户裁决**，不得擅自改判）· **`CG-10` 工作量小（3 行夹具 + 1 行方法）但建议随 G3**（补语料把探针分母由 **319 抬到 320** ⇒ 使 G1/G2 冻结件对照**失去同语料前提**，且「声称可捕获」须配一次变异轮次）· `CG-03`/`09`/`11`/`12` **中–大、无技术阻塞**，归 **G3/G4** ⇒ **本格未做任何修复**（除 `CG-07`），这正是「落件 ≠ 修」在规模控制下的执行。**判据面（全部本次实测）**：探针全量重跑 **38s**（`env -u PYTHONPATH` 去 b