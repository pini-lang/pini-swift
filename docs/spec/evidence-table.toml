[[evidence]]
id = "2026-09-16 P4-4 REPL 求值路径的两引擎对等"
citable = false
claim = "The REPL evaluates on both engines and the two agree. Evaluation used to live inside the CLI's `ReplSession` and construct `Interpreter()` directly, which made it both engine-bound and unreachable from a test (the test target depends on PiniCore, not the executable) -- so the existing REPL suite covered parsing only, and 'REPL cases green on the HIR engine' had no content. P4-4 moves evaluation into `PiniCore`'s `ReplEvaluator` with the engine as a parameter, and the cases drive it on both engines. The two engines meet 'no main yet' at different phases -- the interpreter throws `mainNotFound` at run time, the lowerer refuses while lowering because it wants an executable program -- so the evaluator decides that condition by asking whether `main` exists rather than by matching an error message. A pre-existing defect surfaced while writing the cases and is filed rather than fixed: the declaration starters do not match Pini's declaration syntax (`名字|func(…)`, `(结构体)`, `[枚举]`, `<trait>` are all read as expressions), `let`/`var` are accepted as top-level declarations and then poison the session, and a single-line `{名字}` balances its brackets so a multi-line body cannot be typed."
