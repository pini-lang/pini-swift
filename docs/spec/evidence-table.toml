# Pini spec 证据表（Evidence Ledger）
#
# 治理协议：spec §1.4 证据新鲜度协议（Evidence Freshness）
# - 粒度：60 分钟。证据自 validated_at 起 60 分钟内可信；超期未重新验证 → status = "STALE"（不可信）。
# - 过筛不成即不可信：治理时 grep/read 对应 code_ref——找不到符号、或语义不符 → STALE，
#   不得作为写入依据。机械过筛（行号存在/符号存在）≠ 可信；语义验证才算 FRESH。
# - 行号 = 软证据（软定位）：code_ref 中的行号仅作快速查看指导，不参与 FRESH/STALE 判定。
#   注释/编辑会移动行号（spec §A 出处曾整体漂移 +120~180 行而语义未变）；权威判定键 = 符号名 + 语义。
#   行号漂移而符号仍在附近 → 证据仍可信；治理时可顺手更新行号（见各条目 note 中的「code_ref 自 X 修正」）。
# - 刷新协议（MUST）：把待刷新的 STALE 条目拷贝到新条目（保留痕迹），移除旧条目，
#   重新验证后写入新 validated_at。每次治理只保留一张当前证据表（本文件）。
# - status 取值：FRESH（本次治理 ≤60min 内验证通过）| STALE（超期 / 验证失败 / 语义已过时）。
# - 约定：code_ref 行号为软证据；若 spec 正文仍引用旧行号，在 note 中标注，
#   由治理方按 code_ref 同步修正 spec 正文（§A 出处块行号系统性漂移，见本次 refresh_note）。
#
#
# - ID 形态（2026-09-15 起）：中文自描述短语 + 日期前缀。旧编号 E-NNN 已停用；
#   ID **不得被外部载体引用**（每条 `citable = false` 即此标注）。引用口径与检查见 [meta] id_policy。
#
# - 载体失效标记（2026-09-19 起）：条目的 `artifacts` 是**指针**，指针可以比它所指的东西活得久
#   （测试面删除、源码重构、文档归档都会造成）。凡 `artifacts` 里有**实存不存在**的路径，
#   该条**必须**写 `artifact_status = "carrier-deleted"`；反之不得写。
#   `tools/evidence_sweep.py --check` **两个方向都拦**：悬空而无标记 ⇒ 报错；有标记而全部实存 ⇒ 也报错
#   （不维护的标记会被当装饰，与没有标记等价）。
#   ⚠️ **只拦指针，只报记录**：`command` / `output` / `note` / `claim` 描述的是**当时跑了什么、看到什么**
#   ——载体消失**不能反证当时的观测**，改写它们就是编造实测记录。故这四项**只计数、不改写**。
#
# 本表由治理脚本/人工在批次治理时更新；spec 正文的代码引用以符号定位为主、行号为软证据（§1.4）。

