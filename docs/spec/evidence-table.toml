[[evidence]]
id = "2026-09-19 `P3`：一次「改动到位、编译通过、一条不报」的根因是入口放错"
validated_at = "2026-09-19T21:50+08:00"
status = "FRESH"
citable = false
claim = "检查器的 `check(module:)` 与 `checkCollecting(module:)` 是同一套初始化序列的**两份平行拷贝**（各自做 `importAliasNames` / `preregisterTraits` / `registerTopLevelDeclSignature`），而 `pini check` 的路径只走**后者**。⇒ 任何只加在 `check(module:)` 里的状态，在 `check` 路径上**恒为空集**，依赖它的检查**静默失效**且**无任何机械信号**（编译通过、退出码 0、无警告、门禁全绿）。本批新增的 `E4-015` 因此连改四版全不生效 —— 四次尝试都只动「检查逻辑与判据」，**没有一次离开那个放错的填充函数**。"
command = "19 条勘测探针 + 8 条新码探针（`q0`–`q7`，含 4 条对照）· 两臂全仓语料扫描（112 个 `.pini`）· 全量 `swift test` 两臂 · 变异三级 · 带 `PINI_CLI_BIN` 的 CLI 逐夹具一致性"
output = "四次尝试读数恒为 `check rc=0`（诊断不出现）。抽出共享助手、两个入口都调之后：正例 `q1`（类型名作实参）/ `q2`（作接收者）/ `p6`（声明了 `using` 却写类型名）三条均 `rc=1 E4-015=1`；对照 `q3`（`object` 类型名作值）/ `q4`（显式构造 `配置()`）/ `q5`（同名局部变量遮蔽）/ `q6`（`using` 正路）/ `q7`（标注位 + 构造）五条均 `rc=0`。两臂全仓语料 **112/112 逐文件结论（退出码 + 首个判定码）逐行相同** ⇒ 零回归。全量回归 **63 条 / 4 套件 / 0 失败 / 0 known issue**（基线 `63 / 4 / 0` 且**带 1 known issue**）。变异：**M3** 只摘 `checkCollecting` 里那一行 ⇒ 五条探针全回 `rc=0 E4-015=0`（**复现原故障**）；**M1** 摘遮蔽判据 ⇒ `q5` 转 `rc=1 E4-015=1`（对合法代码**误报**）；**M2** 摘构造豁免 ⇒ `q4` / `q7` 双双转 `rc=1`。变异后工作树与变异前 `git diff` **逐字一致**（已核）。"
note = "要点 = ① **「无信号」的失效最贵**：不报错、不警告、退出码 0，唯一信号是「按设计应当出现的诊断没有出现」⇒ 判据必须是**阳性对照**（本批的 `q1` / `q2`），只看「不该报的没报」永远测不出它。② **修整四下无效后要怀疑测量装置，而不是继续改判据**：四次尝试的共同点是都动了判据，而真正错的地方一次也**没碰**（停手复盘的价值高于第五次尝试）。③ **两份平行拷贝是这类失效的温床** —— 同族的另一次也在本批出现（检查器两处间接调用点漏传 `usingIndices`），两处都是「新状态只加在一份拷贝里」。④ **模板槽名按错误族分**：`TypeError` 侧 = case 关联值标签（本码为 `{typeName}`），`HIRLoweringError` 侧因是自由文本消息、反射取不到载荷而**固定为 `{feature}`**；首稿照抄邻族 ⇒ 输出原样漏印 `'{feature}'`，且**无门禁拦截**（`fill` 找不到键即原样输出）。⑤ 本批顺带把带 `PINI_CLI_BIN` 的 CLI 逐夹具一致性**做实**（29 夹具）—— 该用例此前以 known issue 形态**空跑**，回归读数由「1 known issue」变为「0」。⑥ **ADR 的一条前提被探针否证**：原写「体内可直接写 `应用服务.提交(...)` 绕过 `using` ⇒ 依赖仍可隐藏」，实测类型名在值位被判「未声明的变量」，且 `object` 类型名作值的**对照组报同一条错** ⇒ 是语言的通用性质 ⇒ 依赖**本来就不可隐藏**，故本批把「强制规则」降级为**一条可行动的诊断**。存量条目未重新验证。"
