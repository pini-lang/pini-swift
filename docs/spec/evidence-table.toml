note = "三层自缺陷实测与修复（立案 docs/issue-hir-probe-containment-2026-09-11.md，同批 Closed）。① **死锁**：超时后第二次 communicate() 无界，而组杀不保证杀到 lli——实测 pini 已死（进程表无 pini run-llvm）而 lli 存活于自身进程组（Foundation.Process 给子进程另建组）并持有继承来的管道，故排空永久阻塞：探针不返回、不报错、不落任何 verdict。② **判定丢失**：挂死通道退出码 124 被「旧后端非零退出 → FRONTEND_FAIL」规则先行命中，挂死被记为前端问题、不进阻塞计数；指纹取证（/tmp 残留 15 个孤儿 IR，两组同源 md5 交替出现、间隔精确 30s）反证更早的 sweep 早已发生同类挂死且全部躺在该桶内。③ **收割器陷阱**：本会话沙箱拒绝执行 /bin/ps（bash 与 python 均 PermissionError），按 ps 读进程表的收割器会静默返回空集、「成功杀 0 个」——遂收敛到 pgrep -fl，不可用时明说 containment UNAVAILABLE 而非假装成功。④ **修复**：有界排空（DRAIN_TIMEOUT 5s；仍超时则关管道 + kill + 限时 wait）；按 argv（/tmp/pini_*.ll 记号，先判程序名以免误伤仅在命令行提及 lli 的 shell）收割孤儿 lli 并删除对应 IR，超时当场一次 + 收尾一次；超时判定前移，新增 TIMEOUT_ALL / TIMEOUT_INTERP / TIMEOUT_LEGACY / GAP_HANG（后者计入翻转阻塞）；收尾复查存活 lli，有则打印 STILL ALIVE 并以退出码 1 结束（存活进程是工具失败，非夹具结论）；报告累计收割数（只报收尾那一次会印出「0 killed」而 /tmp 同时干净，自相矛盾）；自清理本轮杂散 IR。⑤ compare-sweeps.py 的 BLOCKERS 元组补入 GAP_HANG，否则翻转批的隔离证明会漏算新引入的挂死。⑥ 订正 run() 内一句已被实测证伪的旧注释（原称「组杀能同时带走两者」）。⑦ **A/B**（夹具 testContinueInWhile.pini，程序按自身语义即死循环）：修复前永不返回 / 1 个 lli 空转 / 孤儿 IR +1 / 判 FRONTEND_FAIL（假）；修复后 41s / 0 存活 / 0 孤儿 / 判 TIMEOUT_ALL（真）/ 退出码 0。⑧ **全量**：7 根 389 夹具 763s 退出码 0，收尾复查 0 存活 0 孤儿，摘要记 2 lli killed in total, 0 of them at exit；真阻塞 8（F4 嵌套容器 COW 4 + F5 聚合打印 4），全为显式信号（C4 的 E6-004 ×4、C5 降级期拒绝 ×3、C5 运行期 panic ×1），无 GAP_HANG、无静默错。⑨ **数字订正**：E-156 所记「13 → 7」订正为 8（testNestedCOWIRContract_2 从未计入 13 的基线）；FRONTEND_FAIL 43 -> 42 即「1 例隐藏挂死搬出假桶」的直接证据；旧分母缺 IRGeneratorTests / HIRTests 两根（死锁致从未跑通），本批新覆盖 155 例。⑩ **隔离证明**：在 234 个新旧两把尺都量过的夹具上 verdict 变动 0 例。⑪ X2 清单闭合：CHANGE_F64 15 + CHANGE_OTHER 1 = 早先所记 16 项。⑫ 未做：未 push；未进 M6b（翻转批待点名）；未改宿主源码。"

