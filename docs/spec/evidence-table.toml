# Pini spec 证据表（Evidence Ledger）
#
# 治理协议：spec §1.4 证据新鲜度协议（Evidence Freshness）
# - 粒度：60 分钟。证据自 validated_at 起 60 分钟内可信；超期未重新验证 → status = "STALE"（不可信）。
# - 过筛不成即不可信：治理时 grep/read 对应 code_ref——找不到符号、或语义不符 → STALE，
#   不得作为写入依据。机械过筛（行号存在/符号存在）≠ 可信；语义验证才算 FRESH。
# - 行号 = 软证据（软定位）：code_ref 中的行号仅作快速查看指导，不参与 FRESH/STALE 判定。
#   注释/编辑会移动行号（spec §A 出处曾整体漂移 +120~180 行而语义未变）；权威判定键 = 符号名 + 语义。
#   行号漂移而符号仍在附近 → 证据仍可信；治理时可顺手更新行号（见各条目 note 中的「code_ref 自 X 修正」）。
# - 刷新协议（MUST）：把待刷新的 STALE 条目拷贝到新条目（保留痕迹），移除旧条目，
#   重新验证后写入新 validated_at。每次治理只保留一张当前证据表（本文件）。
# - status 取值：FRESH（本次治理 ≤60min 内验证通过）| STALE（超期 / 验证失败 / 语义已过时）。
# - 约定：code_ref 行号为软证据；若 spec 正文仍引用旧行号，在 note 中标注，
#   由治理方按 code_ref 同步修正 spec 正文（§A 出处块行号系统性漂移，见本次 refresh_note）。
#
#
# - ID 形态（2026-09-15 起）：中文自描述短语 + 日期前缀。旧编号 E-NNN 已停用；
#   ID **不得被外部载体引用**（每条 `citable = false` 即此标注）。引用口径与检查见 [meta] id_policy。
#
# - 载体失效标记（2026-09-19 起）：条目的 `artifacts` 是**指针**，指针可以比它所指的东西活得久
#   （测试面删除、源码重构、文档归档都会造成）。凡 `artifacts` 里有**实存不存在**的路径，
#   该条**必须**写 `artifact_status = "carrier-deleted"`；反之不得写。
#   `tools/evidence_sweep.py --check` **两个方向都拦**：悬空而无标记 ⇒ 报错；有标记而全部实存 ⇒ 也报错
#   （不维护的标记会被当装饰，与没有标记等价）。
#   ⚠️ **只拦指针，只报记录**：`command` / `output` / `note` / `claim` 描述的是**当时跑了什么、看到什么**
#   ——载体消失**不能反证当时的观测**，改写它们就是编造实测记录。故这四项**只计数、不改写**。
#
# 本表由治理脚本/人工在批次治理时更新；spec 正文的代码引用以符号定位为主、行号为软证据（§1.4）。

[meta]
spec_ref = "pini-spec-v0.md §1.4"
granularity_minutes = 60
scan_exclude = ["docs/spec/issue/archive/issue-evidence-table-sweep-2026-09-03.md"]
artifact_policy = "条目的 `artifacts` 是**指针**，指针可以比它所指的东西活得久。凡 `artifacts` 里有**实存不存在**的路径，该条必须写 `artifact_status = \"carrier-deleted\"`；反之不得写。`tools/evidence_sweep.py --check` 两个方向都拦（悬空无标记 / 有标记而全实存），因为**不维护的标记与没有标记等价**。⚠️ 只拦指针、只报记录：`command`/`output`/`note`/`claim` 记的是**当时的观测**，载体消失不能反证当时的观测 ⇒ 这四项只计数、不改写（2026-09-19 口径）"
id_policy = "本表 ID 为**中文自描述短语 + 日期前缀**，**只供读表**，不得被任何外部载体引用：本表是滚动表，条目按新鲜度自动清扫，引用它必然悬空（旧编号 E-NNN 停用即为此故）。外部确需追溯某条已清理的证据时，写「E-NNN（源已删除）」；`tools/evidence_sweep.py --check` 对无该标注的编号出现**报错**（2026-09-15 口径，取代此前的 `dangling_policy` 三分类）"
last_refresh = "2026-09-19T15:53+08:00"
refresh_note = "2026-09-19 **`P1a`（方括号通用形 + 给定块声明位）**：新增一条 —— 「扩展归并只看目标是否注册为名义类型，不看 kind」。要点 = 该发现由**两形糖互通**反推得出（对象目标吃 `(( ))`、结构目标吃 `{{ }}` 均生效），它把「kind 须按目标类别决定」这一计划假设否证，并把通用形的成本从「新 kind + 解析期两遍」降到**一行归并条件**。同批登记两处不覆盖面（目标未声明时静默、`[[结构体名]]` 由静默转为生效）。存量条目未重新验证。2026-09-18 **`P0d-D`（相容桥 + 签名迁移）**：新增五条 —— ①「`Char → String` 单向加宽：三份探针逐向钉住，窄化被拒」· ②「桥两侧原子性：两臂逐行相同」· ③「`chr` 越界改走 panic」· ④「落点比规划件多两类：HIR 降载的三处类型门与 `+` 的结果类型」· ⑤「selfhost 参数面实测 5 处而非静态推的 3 处」。要点 = 判据**两向都测**（窄化那份才是裁定的全部内容）· 桥的 LLVM 探针**剥掉已登记不可运行的那一面**才测得到桥本身 · 一处止损如实上报并**按裁定回退**（登记 `G70`）· 计划件的处数**两处被实测订正**；存量条目未重新验证"
last_sweep = "2026-09-18T23:12:00+08:00"
[[evidence]]
id = "2026-09-18 selfhost 字符原语参数面：实测 5 处，非静态推的 3 处"
citable = false
claim = """Landing the Char parameter face on the host predicates makes the selfhost lexer uncompilable in five places rather than the three the plan inferred, and the difference is which naming family was searched. The three that were counted (is_digit, is_alpha, is_alnum) are predicate forwarders; the two that were missed (is_hex_digit, hex_value) are codepoint forwarders that call ord, live in a different naming family, and are reachable only if the search is by what a body calls rather than by what the function is called. All five fail for one reason and none can be rescued by the widening ruling, because the failure is inside the body and points the narrowing way. The call sites need no change at all: they pass elements of chars(src), which are Chars now, so those are the widening direction. The count mattered rather than the workload - the authorized scope was three, so the batch stopped and the state was registered instead of being finished quietly."""
artifacts = [
  "examples/selfhost/src/lexer/lexer.pini",
  "examples/selfhost/tools/gate.sh",
  "docs/spec/pini-spec-v0.md"
]
command = "cd examples/selfhost && ../../.build/debug/pini check . ; echo rc ; git status --porcelain ; git rev-parse --short HEAD"
output = "Check exits 1 with E4-001 at lexer.pini:500 (expected Char, got String). The scan lists five declarations whose parameter is String and whose body forwards to a Char-faced builtin, at lines 497 / 502 / 510 / 685 / 696, and every caller passing cs[i] or cs[j], which are Chars. The tree is back on main at 73249be with a clean status, so no half-applied change is left behind; the consequence is that selfhost check is red, which is what the registration records."
validated_at = "2026-09-18T12:16+08:00"
status = "STALE"
note = "⇒ 该状态登记为 spec 台账 `G70`（含 5 处清单、代价面、解除条件）。⚠️ **代价面已实测**：宿主四道门禁**均显式排除** selfhost（各自持排除理由）⇒ 该红**只落在 selfhost 自己的 gate**（其第 4 项 = `pini check .`），不污染宿主门禁。"

[[evidence]]
id = "2026-09-19 扩展归并只看目标是否注册为名义类型，不看 kind：两形糖互通即是证据"
citable = false
claim = ["The extension merge never looked at the kind at all - it looks at whether the target name is registered as a nominal type. The evidence is that the two specialised brackets are interchangeable today: an object target accepts `((...))` and a struct target accepts `{{...}}`, both running correctly, which no kind-based rule could produce since each pair contradicts the other's bracket. That is why making `[[X]]` the general form cost one clause in the merge condition rather than a new kind, and why enum targets keep their old behaviour for free: enums live in a separate registry, so a bracket extension over an enum never had a consumer and still does not. It also falsifies the plan's assumption that the kind would have to be decided from the target's category - the category decides where methods merge, but it does not need to be known at parse time. With the bracket kind added to the merge, `[[X]]` over a struct now binds its methods where the same spelling used to drop them silently."]
artifacts = [
  "Sources/PiniCore/HIR/HIRLowerer.swift",
  "Sources/PiniCore/AST/Declarations/ExtensionDecl.swift",
  "Tests/PiniTests/GivenUsingTests.swift",
]
command = "pini run on two mis-bracketed probes (object target with `(( ))`, struct target with `{{ }}`), then pini run/check on a bracket extension over a struct, over an enum, and over a given block; swift test --filter GivenUsingTests ; swift test --scratch-path /tmp/pini-build-base (baseline worktree at 9d4f7b6)"
output = ["The mis-bracketed pair prints 77 and 3, so both brackets work on both nominal categories. A bracket extension over a struct prints 3 after the change and reported E6-004 before it; over an enum it still reports E6-004, unchanged. A given block parses and is then refused at lowering with E6-004 naming the block and the later batch, instead of being dropped in silence. Tests: 41 passing after the change against 32 passing at the baseline, the nine being the new suite, so the red set is empty on both sides. Removing the one merge clause again turns exactly one test red (the struct case) and leaves the other eight green, and the file is byte-identical to HEAD after restoring."]
validated_at = "2026-09-19T15:53+08:00"
status = "FRESH"
note = "⇒ 推翻了计划件的一处假设（「kind 须由目标的类别在解析期决定」）：实测表明归并层只需要「目标在名义类型注册表里」，kind 本身不参与判定 ⇒ `[[X]]` 只改归并条件即成通用形，枚举与特征各自维持今日行为（零回归面）。⚠️ 同批登记两处**不覆盖面**（见计划件的遗留段）：目标是未声明名 / 特征名时**静默丢弃**无诊断（今日行为，本批未改）；`[[结构体名]]` 的行为**由「静默丢弃」变为「归并生效」**（零语料 ⇒ 无回归面，但属行为变更，已显式登记）。"
