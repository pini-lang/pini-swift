output = "**根因定位到符号**：方法表在「同一名义类型内部」是**按名追加**，而**继承那一格是按名覆盖**（`childMethods + resolvedParent.methods.filter { !childMethodNames.contains($0.name) }`）⇒ 同一问题只有一格漏了。**三形态两腿对照（全部实测）**：① 预置给定块自带 vs 用户 `[[调度器]]` 同名方法 ⇒ 修前解释器腿覆盖生效（后进先出读 `父续`/`乙`/`甲`、默认读 `父续`/`甲`/`乙`）、发射腿 `lli` 拒绝；修后**两腿四读数一致**。② 两个 `((匣))` 扩展块同名方法（**与调度器无关**）⇒ 修前发射腿同样被拒、解释器腿读出后声明者的数；修后两腿同读。③ **同一块内**两个同名方法 ⇒ 前端即拒（`redeclared symbol`）、两腿同 —— **不受本条影响**。**新判据两条**（契约参照件：跨来源同名去重 + 其阴性对照 · 调度策略覆盖后的顺序两半互为反证）：**9/9 全绿**（原 7 条 + 新 2 条）。**变异反证**：合并退回按名追加 ⇒ **两条新判据各转红、其余 7 条全绿**（失败信息正是 `invalid redefinition of function`）；还原后**逐字节校验** ✓。**既有面**：6 套件 **66 tests 全绿**（含「用户覆盖「收下」后跑的是用户那一份」那条 —— 它是覆盖在解释器腿上的既有验收面）。**一处连带读数**：`run-llvm` 在底层工具拒绝模块时**退出码仍为 0**（两条语料各 `rc=0`，错误只在 stderr）⇒ 本批判据**只比 stdout**。"
note = "要点 = ① ⭐ **一处「只在一个后端上现形」的缺陷的通用读法**：另一个后端**静默容忍**同一份输入（这里是「字典后写者胜」）⇒ 它的存在**反而掩盖**了缺陷，而后端之间的读数差只在**跑真程序**时才看得见 ⇒ 判据必须**各后端各跑一次**，⛔ 不能靠「解释器后端绿了就算数」。② ⭐ **「同一个问题在两处、只有一个处打了补丁」**：继承那一格早已按名覆盖，自身 vs 扩展块这一格没有 —— 定位这类缺陷的捷径是**找它的同族**，而不是从头推。③ ⛔ **修法有一条硬约束**（既有判据守着）：**不得**走「让扩展块算占名 ⇒ 预置整体让位」—— 那条路会连带弄丢预置块的队列字段，而既有的覆盖判据正是钉住这条边界的。④ ⚠️ **一处诚实标注**：重名且**签名不同**时，降载期的类型推断从「取首条（预置版）」改为「取用户版」；改动前首条是预置版而运行取的是用户版，**本身即内部不一致**，本条把它统一到用户版（仓内**无此类语料**，实测扫过测试面与样例面）。⑤ ⛔ **两笔不同族、不顺手修**：`run-llvm` 底层失败而**退出码为 0**（命令行面）· 语言参考扩展块那张形式表把 `[[名称]]` 写成枚举（实现是**通用形**，属既有失实）。"
