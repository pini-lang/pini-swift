citable = false
claim = ["The extension merge never looked at the kind at all - it looks at whether the target name is registered as a nominal type. The evidence is that the two specialised brackets are interchangeable today: an object target accepts `((...))` and a struct target accepts `{{...}}`, both running correctly, which no kind-based rule could produce since each pair contradicts the other's bracket. That is why making `[[X]]` the general form cost one clause in the merge condition rather than a new kind, and why enum targets keep their old behaviour for free: enums live in a separate registry, so a bracket extension over an enum never had a consumer and still does not. It also falsifies the plan's assumption that the kind would have to be decided from the target's category - the category decides where methods merge, but it does not need to be known at parse time. With the bracket kind added to the merge, `[[X]]` over a struct now binds its methods where the same spelling used to drop them silently."]
