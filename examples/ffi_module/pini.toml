# FFI & unsafe 模块清单（FFI 子系统 / 解释器 dlsym 加载，spec 2.7）
# 本目录含 pini.toml ⇒ CLI 将其视为一个「多文件模块」（ffimodule），而非独立文件集合。
[package]
name = "ffimodule"
version = "0.1.0"

# FFI 配置：演示可配的三个点。
# abi：全局唯一 ABI，默认 "C"，子模块不可覆盖；search_paths：库搜索路径，相对「本模块目录」解析、
# 与调用 cwd 解耦（这里指向 vendored 依赖 lib/）；libs：需链接的库，解释器经 dlsym 按块名解析 libffilib。
[ffi]
abi = "C"
search_paths = ["lib"]
libs = ["ffilib"]
