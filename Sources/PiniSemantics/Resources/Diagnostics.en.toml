# [E6-008] — reserved: cycle detection is deferred, so the code is registered with no trigger site. The number is
# never reused and the deferred implementation keeps it; the message template is a placeholder and may be
# rewritten, the code itself may not.
[E6-008]
message = "the default instance dependencies of a given block form a cycle (reserved: cycle detection is not implemented yet)"
suggestion = "split the shared state into a smaller layer, or pass it explicitly"

[E6-009]
message = "`await`/`wait` does not match its enclosing body: `await` needs an async body (`=>`), `wait` needs a synchronous one (`->`)"
suggestion = "use the keyword that matches the body, or change the function's async declaration"

[E6-010]
message = "`await` sits where there is no resumable point: it gives the task up, and nothing here can pick the body back up"
suggestion = "move the wait to a statement root at the top level of the body: a bare `await f()` · `var x = await f()` · `try await f() else …` · `match await f():`. The same four forms nested inside `if`, a loop body or a `match` case do not qualify either -- the resume jump cannot reach into a nested block"

[E6-011]
message = "IR structure invariant broken: {feature}"
suggestion = "this is a compiler defect, not a program error: report it together with the source file that reproduces it"
