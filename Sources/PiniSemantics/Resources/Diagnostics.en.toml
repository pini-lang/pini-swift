# Pini diagnostic resources (en, default). Error code → message / suggestion template; placeholders {param} are
# filled from the error payload by associated-value label, unlabelled cases fall back to in-code text. These
# files (en/zh) are the authoritative mapping and append-only; the derived readable table may follow, not gated.

[labels]
lexer = "Lexer Error"
parser = "Parse Error"
semantic = "Semantic Error"
semanticWarning = "Semantic Warning"
type = "Type Error"
runtime = "Runtime Error"
irgen = "IRGen Error"
validator = "IR Structure Error"
io = "IO Error"
general = "Error"

[E7-001]
message = "unused variable '{name}'"
suggestion = "remove it, or prefix with `_` if intentionally unused"

[E7-002]
message = "implicit alias '{alias}' does not match the target module name '{targetName}'"
suggestion = "rename the alias, or ignore if intentional (advisory only)"

[E7-003]
message = "given block materialization cycle: {path}"
suggestion = "materializing it requires itself, so `pini run` will crash; break the field initializer's dependency on itself"

[E7-004]
message = "type '{typeName}' declares no error code; {code} was assigned automatically"
suggestion = "that code is not stable across versions; write `码() -> (I32,)` in an extension block to pin it"

[E7-005]
message = "error code {code} belongs to both '{first}' and {others}"
suggestion = "the C side cannot tell them apart; change one of the declared codes, or ignore if the merge is intentional"

[E2-001]
message = "expected {expected}, got {actual}"
# E2-002 expectedToken(token) 为单关联值 case（无法提取参数名），走英文硬编码兜底。
